<!DOCTYPE html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>
*{box-sizing:border-box}body{margin:0;padding:15px 6px;background:transparent;font-family:-apple-system,BlinkMacSystemFont,"Yu Gothic","Hiragino Kaku Gothic ProN","Meiryo",sans-serif}
.fate-dialogue{--theme:#D94B49;position:relative;display:flex;align-items:center;gap:15px;max-width:850px;margin:12px auto;padding:28px 24px;border:2px solid var(--theme);border-radius:16px;background:linear-gradient(135deg,#1b1923f5,#10131ef5);box-shadow:0 0 14px color-mix(in srgb,var(--theme) 38%,transparent),inset 0 0 30px color-mix(in srgb,var(--theme) 12%,transparent);color:#fff}
.fate-dialogue:before,.fate-dialogue:after{content:"";position:absolute;left:0;width:100%;height:40px;background:var(--theme);mask:url("https://testingcf.jsdelivr.net/gh/eumenes12ds/ASTRAEA-JP@v1.5.8/static/images/lilith/frame-top.svg") center/100% auto no-repeat;pointer-events:none;opacity:.8;filter:drop-shadow(0 0 5px var(--theme))}.fate-dialogue:before{top:-5px}.fate-dialogue:after{bottom:-10px;transform:rotate(180deg);mask-image:url("https://testingcf.jsdelivr.net/gh/eumenes12ds/ASTRAEA-JP@v1.5.8/static/images/lilith/frame-bottom.svg")}
.avatar-wrapper{flex-shrink:0;width:120px;height:120px;margin-left:5px;position:relative;z-index:1}.avatar{width:100%;height:100%;display:block;border-radius:50%;object-fit:cover;border:3px solid var(--theme);box-shadow:0 0 15px var(--theme)}
.content-wrapper{flex:1;min-width:0;min-height:120px;position:relative;z-index:1;display:flex;flex-direction:column;justify-content:center}.char-name{font-size:16px;font-weight:700;color:var(--theme);margin-bottom:10px;letter-spacing:1px;line-height:1.5;text-shadow:0 0 8px color-mix(in srgb,var(--theme) 60%,transparent)}.char-name:before{content:"✦";margin-right:6px;font-size:12px}.dialogue-text{font-size:16px;line-height:1.6;color:#f3eff5;margin:0;white-space:pre-wrap;overflow-wrap:anywhere;text-shadow:0 2px 4px #0009}.dialogue-text:before{content:"「";color:var(--theme);font-weight:700;margin-right:4px}.dialogue-text:after{content:"」";color:var(--theme);font-weight:700;margin-left:4px}
@media(max-width:600px){.fate-dialogue{display:block;padding:15px 12px 20px}.avatar-wrapper{position:absolute;top:15px;left:12px;width:50px;height:50px;margin:0}.avatar{border-width:2px}.content-wrapper{display:block;min-height:0;margin-top:5px}.char-name{margin-left:60px;min-height:50px;margin-bottom:5px;display:flex;align-items:center;font-size:15px;letter-spacing:0}.dialogue-text{clear:both;margin:0 2px;padding-top:8px;font-size:15px;line-height:1.5;border-top:1px solid color-mix(in srgb,var(--theme) 25%,transparent)}.fate-dialogue:after{bottom:-5px;height:30px;opacity:.6}}
</style></head><body><article class="fate-dialogue" data-core="don-quixote"><div class="avatar-wrapper"><img class="avatar" alt="ドン・キホーテの肖像" src="https://testingcf.jsdelivr.net/gh/eumenes12ds/ASTRAEA-JP@v1.5.9/static/images/fate-cores/don-quixote.png" width="120" height="120"></div><div class="content-wrapper"><div class="char-name" data-speaker="$2$4">ドン・キホーテ</div><p class="dialogue-text">$3$5</p></div></article><script>(()=>{const text=document.querySelector('.dialogue-text');let value=text.innerHTML.trim();if(value.startsWith('「')&&value.endsWith('」'))value=value.slice(1,-1).trim();text.innerHTML=value;})();</script></body></html>
