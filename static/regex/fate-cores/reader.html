function handleFSZAction(container, e, toastFn) {

  function onSqClick(ev) {
    if (G.over || G.aiThinking || G.turn !== G.pCol) return;
    var sq = ev.currentTarget,
      r = parseInt(sq.getAttribute("data-r")),
      c = parseInt(sq.getAttribute("data-c"));
    if (G.sel) {
      var mv = null;
      for (var i = 0; i < G.lm.length; i++) {
        if (G.lm[i].tr === r && G.lm[i].tc === c) {
          mv = G.lm[i];
          break;
        }
      }
      if (mv) {
        var isPromo =
          pT(G.board[mv.fr][mv.fc]) === "P" && (mv.tr === 0 || mv.tr === 7);
        if (isPromo) {
          showPromo(mv);
          return;
        }
        doMove(mv);
        return;
      }
      if (G.board[r][c] && pC(G.board[r][c]) === G.pCol) {
        G.sel = [r, c];
        G.lm = legal(G.board, G.pCol, G.cas, G.ep).filter(function (m) {
          return m.fr === r && m.fc === c;
        });
        renderBoard();
        return;
      }
      G.sel = null;
      G.lm = [];
      renderBoard();
      return;
    }
    if (G.board[r][c] && pC(G.board[r][c]) === G.pCol) {
      G.sel = [r, c];
      G.lm = legal(G.board, G.pCol, G.cas, G.ep).filter(function (m) {
        return m.fr === r && m.fc === c;
      });
      renderBoard();
    }

    po.addEventListener("click", function (ev3) {
      ev3.stopPropagation();
      po.remove();

  async function doMove(mv) {
    if(G_closed||G.over)return;
    if (G_difficulty === "hard") G_uciMoves.push(cvtMv(mv));
    var res = mkMv(G.board, mv, G.cas, G.ep);
    G.board = res.board;
    G.cas = res.cas;
    G.ep = res.ep;
    G.turn = G.turn === "w" ? "b" : "w";
    G.sel = null;
    G.lm = [];
    G.lastMv = mv;
    renderBoard();
    var oMvs = legal(G.board, G.turn, G.cas, G.ep);
    if (oMvs.length === 0) {
      G.over = true;
      if (inCk(G.board, G.turn)) {
        if (G.turn === G.aiCol) {
          var rw =

            1;

          showResult("チェックメイト！あなたの勝ちです", saved ? "運命ポイント +"+rw : "報酬を保存できませんでした");

      setStatus("夜夢が考えています…");
      G.aiThinking = true;
      requestAI();
    } else setStatus("あなたの手番");

  function aiMove() {
    if(G_closed||G.over||G.turn!==G.aiCol)return;

}
  gm.innerHTML =

  gm.querySelector(".chess-close").addEventListener("click", closeChess);

  });
  ov.appendChild(sel);
  ov.appendChild(gm);
  doc.body.appendChild(ov);G_closeObserver=new MutationObserver(()=>{if(!ov.isConnected)closeChess();});G_closeObserver.observe(doc.body,{childList:true,subtree:true});
  ov.addEventListener("click", function (ev4) {
    if (ev4.target === ov) closeChess();
  });
  sel.querySelectorAll("[data-diff]").forEach(function (btn) {
    btn.addEventListener("click", function () {
      G_difficulty = btn.getAttribute("data-diff");

      sel.querySelectorAll("[data-c]").forEach(function (cb) {

}

function initReaderControls() {
  const panel=document.getElementById('reader-panel');
  document.querySelectorAll('[data-reader-tab]').forEach(button=>button.addEventListener('click',()=>{
    const tab=button.dataset.readerTab;
    if(panel.dataset.tab===tab&&!panel.hidden){panel.hidden=true;return;}
    panel.dataset.tab=tab;panel.hidden=false;
    panel.innerHTML=tab==='persona'?buildPersonaListHTML():buildMenuHTML();
  }));
  panel.addEventListener('click',function(e){
    if(handlePersonaAction(panel,e,showToast))return;
    const sizes=panel.querySelector('[data-fontsize-container]');if(sizes&&sizes.contains(e.target)&&handleFSZAction(sizes,e,showToast))return;
    const order=e.target.closest('[data-order]');if(order){orderItem(order.dataset.order);return;}
    const action=e.target.closest('[data-action]')?.dataset.action;
    if(action==='toggleMode')toggleDisplayMode(e);
    if(action==='toggleSilent')toggleSilent(e);
    if(action==='chess')openChessGame(e);
  });
  document.getElementById('reader-letter').addEventListener('click',()=>{eFS();openFP();});
  document.getElementById('reader-mode').addEventListener('click',toggleDisplayMode);
  document.getElementById('reader-silent').addEventListener('click',toggleSilent);
  document.getElementById('reader-chess').addEventListener('click',openChessGame);
  document.getElementById('reader-auto').addEventListener('click',toggleAutoUnseal);
}
