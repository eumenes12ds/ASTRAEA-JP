<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TRPG戦闘パネル美化</title>
  <script src="https://testingcf.jsdelivr.net/gh/eumenes12ds/ASTRAEA-JP@v1.5.3/static/vendor/jquery-3.7.1.min.js"></script>
  <script src="https://testingcf.jsdelivr.net/gh/eumenes12ds/ASTRAEA-JP@v1.5.3/static/vendor/lodash-4.17.21.min.js"></script>
  <link rel="stylesheet" href="https://testingcf.jsdelivr.net/gh/eumenes12ds/ASTRAEA-JP@v1.5.3/static/vendor/fontawesome/css/all.min.css">
  
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Noto Serif SC', serif; color: #e8d5b7; }
    #output-container { max-width: 800px; margin: 0 auto; }

    .action-panel {
      background: linear-gradient(180deg, rgba(30,30,50,0.95) 0%, rgba(20,20,35,0.98) 100%);
      border: 2px solid #8b7355;
      border-radius: 8px;
      margin-bottom: 20px;
      overflow: hidden;
      position: relative;
    }
    .action-panel::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 3px;
      background: linear-gradient(90deg, transparent, #ffd700, transparent);
    }

    .panel-header {
      background: linear-gradient(90deg, #2d2d44 0%, #3d3d5c 50%, #2d2d44 100%);
      padding: 12px 16px;
      border-bottom: 1px solid #8b7355;
      display: flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
      user-select: none;
      transition: background 0.2s ease;
    }
    .panel-header:hover {
      background: linear-gradient(90deg, #3d3d5c 0%, #4d4d6c 50%, #3d3d5c 100%);
    }
    .panel-header i.panel-icon { font-size: 1.2em; color: #ffd700; text-shadow: 0 0 10px rgba(255,215,0,0.5); }
    .panel-title {
      font-family: 'Cinzel', 'Noto Serif SC', serif;
      font-size: 1.1em; font-weight: 700; color: #ffd700;
      text-shadow: 0 0 10px rgba(255,215,0,0.3);
      letter-spacing: 2px; flex: 1;
    }
    .panel-toggle { color: #8b7355; transition: transform 0.3s ease; }
    .panel-header.collapsed .panel-toggle { transform: rotate(-90deg); }

    .panel-content {
      padding: 12px;
      transition: max-height 0.3s ease, padding 0.3s ease, opacity 0.3s ease;
      overflow: hidden;
    }
    .panel-content.collapsed { max-height: 0; padding: 0 12px; opacity: 0; }

    .data-row {
      background: rgba(0,0,0,0.3);
      border: 1px solid rgba(139,115,85,0.3);
      border-radius: 4px;
      padding: 8px 12px;
      margin-bottom: 6px;
      font-size: 0.9em;
      line-height: 1.5;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 4px 8px;
    }
    .data-row:last-child { margin-bottom: 0; }

    .tag {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 3px;
      font-size: 0.85em;
      font-weight: 600;
      margin: 0 2px;
      white-space: normal;
      word-break: break-word;
      max-width: 100%;
      vertical-align: middle;
    }
    .tag-flex {
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .tag-detail {
      display: inline-flex;
      align-items: flex-start;
      gap: 6px;
      line-height: 1.45;
    }
    .tag-detail i,
    .tag-flex i {
      margin-top: 2px;
      flex-shrink: 0;
    }
    .tag-round { background: #4a5568; color: #e2e8f0; }
    .tag-type  { background: #553c9a; color: #e9d8fd; }
    .tag-env   { background: #2c5282; color: #bee3f8; }
    .tag-hp    { background: linear-gradient(135deg, #c53030, #9b2c2c); color: #fff; }
    .tag-hp-low { background: linear-gradient(135deg, #dd6b20, #9c4221); color: #fff; }
    .tag-mp    { background: linear-gradient(135deg, #2b6cb0, #2c5282); color: #fff; }
    .tag-mp-low { background: linear-gradient(135deg, #0f766e, #115e59); color: #fff; }
    .tag-sp    { background: linear-gradient(135deg, #38a169, #276749); color: #fff; }
    .tag-sp-low { background: linear-gradient(135deg, #b7791f, #975a16); color: #fff; }

    .stat {
      display: inline-block;
      padding: 1px 6px;
      background: rgba(255,215,0,0.15);
      border: 1px solid rgba(255,215,0,0.3);
      border-radius: 3px;
      color: #ffd700;
      font-weight: 600;
      font-size: 0.9em;
      margin: 0 1px;
    }
    .stat-str { border-color: #fc8181; color: #fc8181; background: rgba(252,129,129,0.1); }
    .stat-agi { border-color: #68d391; color: #68d391; background: rgba(104,211,145,0.1); }
    .stat-con { border-color: #f6ad55; color: #f6ad55; background: rgba(246,173,85,0.1); }
    .stat-int { border-color: #63b3ed; color: #63b3ed; background: rgba(99,179,237,0.1); }
    .stat-spi { border-color: #b794f4; color: #b794f4; background: rgba(183,148,244,0.1); }

    .status-label { color: #805ad5; font-weight: 600; }
    .status-effect {
      display: inline-block;
      padding: 2px 8px;
      background: rgba(128,90,213,0.2);
      border: 1px solid #805ad5;
      border-radius: 4px;
      margin: 0 2px;
      font-size: 0.85em;
      white-space: normal;
      word-break: break-word;
      max-width: 100%;
    }
    .status-effect strong { color: #e9d8fd; }
    .field-label { color: #d6bcfa; font-weight: 600; }

    /* ========== フロー矢印 -> スタイル ========== */
    .arrow-flow {
      color: #8b9dc3;
      font-weight: 600;
      padding: 0 3px;
      opacity: 0.85;
    }

    .highlight-num { color: #fbd38d; font-weight: 700; }
    .dice          { color: #63b3ed; font-weight: 700; }
    .enemy-name    { color: #f56565; font-weight: 700; }
    .ally-name     { color: #68d391; font-weight: 700; }
    .item-name     { color: #f6e05e; font-weight: 700; }
    .skill-name    { color: #90cdf4; font-weight: 700; }
    .note          { color: #a0aec0; font-style: italic; }
    .char-name     { font-weight: 700; color: #e9d8fd; }
    .char-name.enemy { color: #fc8181; }

    @media (max-width: 600px) {
      .panel-header { padding: 10px 12px; }
      .panel-title  { font-size: 1em; letter-spacing: 1px; }
      .panel-content { padding: 10px; }
      .data-row     { font-size: 0.85em; padding: 6px 8px; }
    }
  </style>
</head>
<body>
  <div id="output-container">
    <div id="content"></div>
  </div>

  <script>
    const mockBattleText = `__AST_DATA__`;

    const PanelConfig = {
      '戦況総覧':   { icon: 'fa-solid fa-scroll',           color: '#ffd700' },
      '戦況総覧':   { icon: 'fa-solid fa-scroll',           color: '#ffd700' },
      '行動順序':   { icon: 'fa-solid fa-hourglass-half',   color: '#63b3ed' },
      '行動順序':   { icon: 'fa-solid fa-hourglass-half',   color: '#63b3ed' },
      '攻撃行動':   { icon: 'fa-solid fa-crosshairs',       color: '#fc8181' },
      '攻撃行動':   { icon: 'fa-solid fa-crosshairs',       color: '#fc8181' },
      'ダメージ基準計算': { icon: 'fa-solid fa-calculator',     color: '#ed8936' },
      'ダメージ基準計算': { icon: 'fa-solid fa-calculator',     color: '#ed8936' },
      '決済リスト':   { icon: 'fa-solid fa-list-check',       color: '#68d391' },
      '決済リスト':   { icon: 'fa-solid fa-list-check',       color: '#68d391' },
      '決済明細':   { icon: 'fa-solid fa-list-check',       color: '#68d391' },
      '戦術動作':   { icon: 'fa-solid fa-chess-knight',     color: '#9f7aea' },
      '戦術動作':   { icon: 'fa-solid fa-chess-knight',     color: '#9f7aea' },
      '戦術動作 - 逃走': { icon: 'fa-solid fa-person-running', color: '#975a16' },
      '戦意判定':   { icon: 'fa-solid fa-heart-crack',      color: '#f56565' },
      '戦意判定':   { icon: 'fa-solid fa-heart-crack',      color: '#f56565' },
      '戦闘決済':   { icon: 'fa-solid fa-flag-checkered',   color: '#48bb78' },
      '戦闘決済':   { icon: 'fa-solid fa-flag-checkered',   color: '#48bb78' },
      '経験決済':   { icon: 'fa-solid fa-chart-line',       color: '#f6e05e' },
      '経験決済':   { icon: 'fa-solid fa-chart-line',       color: '#f6e05e' },
      '生産準備':   { icon: 'fa-solid fa-hammer',           color: '#ed8936' },
      '生産準備':   { icon: 'fa-solid fa-hammer',           color: '#ed8936' },
      '製作判定':   { icon: 'fa-solid fa-flask',            color: '#63b3ed' },
      '製作判定':   { icon: 'fa-solid fa-flask',            color: '#63b3ed' },
      '生産決済':   { icon: 'fa-solid fa-box-open',         color: '#48bb78' },
      '生産決済':   { icon: 'fa-solid fa-box-open',         color: '#48bb78' }
    };

    function parseActionInfo(text) {
      let content = _.trim(text);
      const tagMatch = content.match(/<action_info>([\s\S]*?)<\/action_info>/);
      if (tagMatch) content = _.trim(tagMatch[1]);
      return parsePanelContent(content);
    }

    function parsePanelContent(content) {
      const lines = _.chain(content).split('\n').map(_.trim).compact().value();
      const sections = [];
      let currentSection = null;
      _.forEach(lines, line => {
        const titleMatch = line.match(/^\{(.+?)\}$/);
        if (titleMatch) {
          if (currentSection) sections.push(currentSection);
          currentSection = { title: titleMatch[1], rows: [] };
          return;
        }
        if (_.startsWith(line, '|') && _.endsWith(line, '|') && currentSection) {
          currentSection.rows.push(_.trim(line.slice(1, -1)));
        }
      });
      if (currentSection) sections.push(currentSection);
      return { sections };
    }

    function beautifyRow(row) {
      let html = _.escape(row);

      const labels = {
        round:        '(?:ラウンド|ターン)',
        environment:  '(?:環境)',
        sequence:     '(?:順序)',
        type:         '(?:タイプ)',
        industry:     '(?:業種)',
        target:       '(?:目標)',
        role:         '(?:キャラクター)',
        attacker:     '(?:攻撃側)',
        defender:     '(?:防御側)',
        object:       '(?:対象)',
        contest:      '(?:対抗)',
        move:         '(?:技)',
        weapon:       '(?:使用武器)',
        consume:      '(?:コスト)',
        execute:      '(?:実行)',
        cert:         '(?:認証)',
        coreStat:     '(?:コア属性|核心属性)',
        quality:      '(?:品質)',
        status:       '(?:状態)',
        statusApply:  '(?:状態付与)',
        stateSummary: '(?:状態決済)',
        checkResult:  '(?:判定結果)',
        result:       '(?:結果)',
        intent:       '(?:意図)',
        battleResult: '(?:戦果)',
        effect:       '(?:効果)',
        statusEffect: '(?:状態効果)',
        resourcePreview: '(?:資源プレビュー|資源事前検査)',
        resourceCost: '(?:資源コスト)',
        settlement: '(?:決済状態)',
        expDetail: '(?:経験明細)',
        expBasis: '(?:経験根拠|経験値の根拠)',
        expTotal: '(?:EXP合計)',
        expActual: '(?:上限後実得EXP|上限後の実際獲得EXP)',
        reward: '(?:報酬)',
        materials:    '(?:投入物)',
        input:        '(?:投入)',
        loss:         '(?:損失)',
        outputList:   '(?:産出リスト)',
        eta:          '(?:予定時間|見積もり時間)',
        timeCost:     '(?:時間コスト)',
        batchCheck:   '(?:一括チェック|一括検査)',
        qualityCheck: '(?:品質要求チェック\\(半製品\\/完成品のみ\\)|品質要求検査\\(半成品\\/完成品のみ\\))',
        licenseCheck: '(?:管制投入物チェック\\(半製品\\/完成品のみ\\)|規制投入物検査\\(半成品\\/完成品のみ\\))'
      };

      const wrapLabeledValue = (label, regex, className, icon, color = null, extraClass = '') => {
        html = html.replace(regex, (m, value) => {
          const displayLabel = _.escape(label);
          const style = color ? ` style="background:${color.background};color:${color.color};"` : '';
          const classes = [className, extraClass].filter(Boolean).join(' ');
          return `${displayLabel} <span class="${classes}"${style}><i class="${icon}"></i> ${value.trim()}</span>`;
        });
      };

      const formatResourceTokens = (value) => value
        .replace(/HP\s*\[?(\d+)\/(\d+)\]?/g, (match, current, max) => {
          const percent = (parseInt(current, 10) / parseInt(max, 10)) * 100;
          const colorClass = percent > 50 ? 'tag-hp' : 'tag-hp-low';
          return `<span class="tag ${colorClass}"><i class="fa-solid fa-heart"></i> HP ${current}/${max}</span>`;
        })
        .replace(/MP\s*\[?(\d+)\/(\d+)\]?/g, (m, cur, max) =>
          (() => {
            const percent = (parseInt(cur, 10) / parseInt(max, 10)) * 100;
            const colorClass = percent > 35 ? 'tag-mp' : 'tag-mp-low';
            return `<span class="tag ${colorClass}"><i class="fa-solid fa-droplet"></i> MP ${cur}/${max}</span>`;
          })())
        .replace(/SP\s*\[?(\d+)\/(\d+)\]?/g, (m, cur, max) =>
          (() => {
            const percent = (parseInt(cur, 10) / parseInt(max, 10)) * 100;
            const colorClass = percent > 35 ? 'tag-sp' : 'tag-sp-low';
            return `<span class="tag ${colorClass}"><i class="fa-solid fa-bolt"></i> SP ${cur}/${max}</span>`;
          })())
        .replace(/HP\s*\[?(\d+)\]?(?![\d\/])/g, (m, val) =>
          `<span class="tag tag-hp"><i class="fa-solid fa-heart"></i> HP ${val}</span>`)
        .replace(/MP\s*\[?(\d+)\]?(?![\d\/])/g, (m, val) =>
          `<span class="tag tag-mp"><i class="fa-solid fa-droplet"></i> MP ${val}</span>`)
        .replace(/SP\s*\[?(\d+)\]?(?![\d\/])/g, (m, val) =>
          `<span class="tag tag-sp"><i class="fa-solid fa-bolt"></i> SP ${val}</span>`);

      // ===== HP / MP / SP =====
      html = formatResourceTokens(html);

      // ===== 五つの能力値 =====
      html = html.replace(/(^|[\s\|])(力)\[?(\d+)\]?/g, (m, sep, _, val) =>
        `${sep}<span class="stat stat-str"><i class="fa-solid fa-dumbbell"></i> 筋力${val}</span>`);
      html = html.replace(/(^|[\s\|])(敏)\[?(\d+)\]?/g, (m, sep, _, val) =>
        `${sep}<span class="stat stat-agi"><i class="fa-solid fa-feather-pointed"></i> 敏捷${val}</span>`);
      html = html.replace(/(^|[\s\|])(体)\[?(\d+)\]?/g, (m, sep, _, val) =>
        `${sep}<span class="stat stat-con"><i class="fa-solid fa-shield-heart"></i> 耐久${val}</span>`);
      html = html.replace(/(^|[\s\|])(智)\[?(\d+)\]?/g, (m, sep, _, val) =>
        `${sep}<span class="stat stat-int"><i class="fa-solid fa-brain"></i> 知力${val}</span>`);
      html = html.replace(/(^|[\s\|])(精)\[?(\d+)\]?/g, (m, sep, _, val) =>
        `${sep}<span class="stat stat-spi"><i class="fa-solid fa-eye"></i> 精神${val}</span>`);

      // ===== 基本タグ =====
      html = html.replace(new RegExp(`${labels.round}:\\s*(\\d+)`, 'g'), (m, num) =>
        `<span class="tag tag-round"><i class="fa-solid fa-rotate"></i> ラウンド ${num}</span>`);
      html = html.replace(new RegExp(`${labels.environment}:\\s*([^|]+)`, 'g'), (m, env) =>
        `環境: <span class="tag tag-env"><i class="fa-solid fa-location-dot"></i> ${env.trim()}</span>`);
      html = html.replace(new RegExp(`${labels.sequence}:\\s*([^|]+)`, 'g'), (m, seq) =>
        `順序: <span class="tag tag-round"><i class="fa-solid fa-list-ol"></i> ${seq.trim()}</span>`);
      html = html.replace(/(^|\|\s*)(コスト|コスト數值):\s*([^|]*(?:\|\s*(?:<span class="tag tag-(?:hp|mp|sp)"[^>]*>.*?<\/span>|(?:HP|MP|SP)\s*\[[^\]]+\]))*)/g,
        (m, prefix, _label, value) => `${prefix}<span class="field-label">コスト:</span> ${value.trim()}`);
      html = html.replace(new RegExp(`${labels.resourcePreview}:\\s*([^|]*(?:\\|\\s*(?:<span class="tag tag-(?:hp|mp|sp)"[^>]*>.*?<\\/span>|(?:HP|MP|SP)\\s*\\[[^\\]]+\\]))*)`, 'g'),
        (m, value) => `<span class="field-label">資源事前検査:</span> ${value.trim()}`);
      html = html.replace(new RegExp(`${labels.resourceCost}:\\s*([^|]*(?:\\s+(?:<span class="tag tag-(?:hp|mp|sp)"[^>]*>.*?<\\/span>|(?:HP|MP|SP)\\s*\\[[^\\]]+\\]))*)`, 'g'),
        (m, value) => `<span class="field-label">資源コスト:</span> ${value.trim()}`);

      // ===== タイプタグ（戦闘/製作） =====
      html = html.replace(new RegExp(`${labels.type}:\\s*([^|]+)`, 'g'), (m, type) => {
        const value = type.trim();
        const mapping = {
          '鍛造':   { icon: 'fa-solid fa-hammer',         background: '#c53030', color: '#fff' },
          '錬金':   { icon: 'fa-solid fa-flask',          background: '#805ad5', color: '#fff' },
          '料理':   { icon: 'fa-solid fa-utensils',       background: '#dd6b20', color: '#fff' },
          '調理':   { icon: 'fa-solid fa-utensils',       background: '#dd6b20', color: '#fff' },
          '裁縫':   { icon: 'fa-solid fa-scissors',       background: '#319795', color: '#fff' },
          '基礎加工': { icon: 'fa-solid fa-gears',        background: '#4a5568', color: '#fff' },
          '半製品': { icon: 'fa-solid fa-cubes',          background: '#2b6cb0', color: '#fff' },
          '半成品': { icon: 'fa-solid fa-cubes',          background: '#2b6cb0', color: '#fff' },
          '完成品':   { icon: 'fa-solid fa-box-open',       background: '#2f855a', color: '#fff' },
          '逃走':   { icon: 'fa-solid fa-person-running', background: '#975a16', color: '#fff' }
        };
        const style = mapping[value];
        if (style) {
          return `タイプ: <span class="tag" style="background:${style.background};color:${style.color};"><i class="${style.icon}"></i> ${value}</span>`;
        }
        return `タイプ: <span class="tag tag-type"><i class="fa-solid fa-tag"></i> ${value}</span>`;
      });

      // ===== wrapLabeledValue 呼び出し =====
      wrapLabeledValue('業種:', new RegExp(`${labels.industry}:\\s*([^|]+)`, 'g'),   'tag tag-type', 'fa-solid fa-industry',        { background: '#744210', color: '#fff' });
      wrapLabeledValue('目標:', new RegExp(`${labels.target}:\\s*([^|]+)`, 'g'),     'tag tag-env',  'fa-solid fa-bullseye',         { background: '#2c5282', color: '#bee3f8' });
      wrapLabeledValue('キャラクター:', new RegExp(`${labels.role}:\\s*([^|]+)`, 'g'),       'tag tag-env',  'fa-solid fa-user',             { background: '#285e61', color: '#e6fffa' });
      wrapLabeledValue('攻撃側:', new RegExp(`${labels.attacker}:\\s*([^|]+)`, 'g'),   'tag tag-hp',   'fa-solid fa-hand-fist',            { background: '#9b2c2c', color: '#fff' });
      wrapLabeledValue('防御側:', new RegExp(`${labels.defender}:\\s*([^|]+)`, 'g'),   'tag tag-mp',   'fa-solid fa-shield',           { background: '#2c5282', color: '#fff' });
      wrapLabeledValue('対象:', new RegExp(`${labels.object}:\\s*([^|]+)`, 'g'),     'tag tag-env',  'fa-solid fa-crosshairs',       { background: '#4a5568', color: '#fff' });
      wrapLabeledValue('対抗:', new RegExp(`${labels.contest}:\\s*([^|]+)`, 'g'),    'tag tag-type', 'fa-solid fa-scale-balanced',   { background: '#553c9a', color: '#fff' });
      wrapLabeledValue('技:', new RegExp(`${labels.move}:\\s*([^|]+)`, 'g'),       'tag tag-type', 'fa-solid fa-wand-sparkles',    { background: '#553c9a', color: '#fff' });
      wrapLabeledValue('使用武器:', new RegExp(`${labels.weapon}:\\s*([^|]+)`, 'g'), 'tag tag-type', 'fa-solid fa-khanda',            { background: '#744210', color: '#fff' });
      wrapLabeledValue('実行:', new RegExp(`${labels.execute}:\\s*([^|]+)`, 'g'),    'tag tag-type', 'fa-solid fa-play',             { background: '#2d3748', color: '#fff' });
      wrapLabeledValue('認証:', new RegExp(`${labels.cert}:\\s*([^|]+)`, 'g'),       'tag tag-type', 'fa-solid fa-certificate',      { background: '#975a16', color: '#fff' });

      // ===== コア属性 =====
      html = html.replace(new RegExp(`${labels.coreStat}:\\s*(筋力)`, 'g'), (m, g1) => `コア属性: <span class="stat stat-str">${g1}</span>`);
      html = html.replace(new RegExp(`${labels.coreStat}:\\s*(知力)`, 'g'), (m, g1) => `コア属性: <span class="stat stat-int">${g1}</span>`);
      html = html.replace(new RegExp(`${labels.coreStat}:\\s*(精神)`, 'g'), (m, g1) => `コア属性: <span class="stat stat-spi">${g1}</span>`);
      html = html.replace(new RegExp(`${labels.coreStat}:\\s*(敏捷)`, 'g'), (m, g1) => `コア属性: <span class="stat stat-agi">${g1}</span>`);
      html = html.replace(new RegExp(`${labels.coreStat}:\\s*(筋力|知力|精神|敏捷)`, 'g'), (m, g1) => `コア属性: <span class="stat">${g1}</span>`);

      // ===== 品質 =====
      html = html.replace(new RegExp(`${labels.quality}:\\s*(ノーマル)`, 'g'),       (m, g1) => `品質: <span style="color:#a0aec0;font-weight:600;">${g1}</span>`);
      html = html.replace(new RegExp(`${labels.quality}:\\s*(優良)`, 'g'),  (m, g1) => `品質: <span style="color:#68d391;font-weight:600;">${g1}</span>`);
      html = html.replace(new RegExp(`${labels.quality}:\\s*(レア)`, 'g'),       (m, g1) => `品質: <span style="color:#63b3ed;font-weight:600;">${g1}</span>`);
      html = html.replace(new RegExp(`${labels.quality}:\\s*(エピック)`, 'g'),  (m, g1) => `品質: <span style="color:#b794f4;font-weight:600;">${g1}</span>`);
      html = html.replace(new RegExp(`${labels.quality}:\\s*(レジェンド)`, 'g'),  (m, g1) => `品質: <span style="color:#f6ad55;font-weight:600;">${g1}</span>`);
      html = html.replace(new RegExp(`${labels.quality}:\\s*(ミシック)`, 'g'),  (m, g1) => `品質: <span style="color:#fc8181;font-weight:600;text-shadow:0 0 8px rgba(252,129,129,0.5);">${g1}</span>`);

      // ===== 状態 =====
      html = html.replace(new RegExp(`(^|\\|\\s*)${labels.status}:\\s*(製作失敗|製作成功|充足|不足(?:\\(中止\\))?)`, 'g'), (m, prefix, state) => {
        const isBad = /失敗|不足/.test(state);
        return `${prefix}状態: <span style="color:${isBad ? '#fc8181' : '#68d391'};font-weight:700;">${_.escape(state)}</span>`;
      });
      html = html.replace(new RegExp(`(^|\\|\\s*)${labels.status}:\\s*([^|]+)`, 'g'), (match, prefix, states) => {
        if (/製作失敗|製作成功|充足|不足/.test(states)) return match;
        const stateList = states.split(/[，,]/).map(s => s.trim()).filter(Boolean);
        const stateHtml = stateList.map(state => {
          const durationMatch = state.match(/\(([^()]*?(?:回合|ターン))\)/);
          const duration = durationMatch ? ` (${durationMatch[1]})` : '';
          const stateName = state.replace(/\([^()]*?(?:回合|ターン)\)/, '').trim();
          return `<span class="status-effect">${stateName}${duration}</span>`;
        }).join('');
        return `${prefix}<span class="status-label">状態:</span> ${stateHtml}`;
      });
      html = html.replace(new RegExp(`${labels.statusApply}\(([^)]+)\):\\s*([^|]+)`, 'g'), (m, effectName, result) =>
        `<span class="field-label">状態付与</span><span class="tag tag-flex" style="background:#553c9a;color:#fff;"><i class="fa-solid fa-burst"></i> ${effectName}</span>: <span style="color:#d6bcfa;">${result.trim()}</span>`);
      html = html.replace(new RegExp(`${labels.stateSummary}:\\s*([^|]+)`, 'g'), (m, summary) =>
        `<span class="field-label">状態決済:</span> <span style="color:#e9d8fd;">${summary.trim()}</span>`);

      // ===== 判定結果 =====
      html = html.replace(new RegExp(`${labels.checkResult}:\\s*(大失敗)`, 'g'), (m, g1) => `判定結果: <span style="color:#e53e3e;font-weight:700;"><i class="fa-solid fa-skull-crossbones"></i> ${g1}</span>`);
      html = html.replace(new RegExp(`${labels.checkResult}:\\s*(失敗)`, 'g'),     (m, g1) => `判定結果: <span style="color:#fc8181;font-weight:700;"><i class="fa-solid fa-times"></i> ${g1}</span>`);
      html = html.replace(new RegExp(`${labels.checkResult}:\\s*(成功)`, 'g'),           (m, g1) => `判定結果: <span style="color:#68d391;font-weight:700;"><i class="fa-solid fa-check"></i> ${g1}</span>`);
      html = html.replace(new RegExp(`${labels.checkResult}:\\s*(完璧|精進)`, 'g'),  (m, g1) => `判定結果: <span style="color:#ffd700;font-weight:700;text-shadow:0 0 8px rgba(255,215,0,0.5);"><i class="fa-solid fa-star"></i> ${g1}</span>`);

      // ===== 結果/戦果 =====
      html = html.replace(new RegExp(`${labels.result}:\\s*(勝利|逃走成功)`, 'g'), (m, g1) =>
        `結果: <span style="color:#48bb78;font-weight:700;"><i class="fa-solid fa-trophy"></i> ${_.escape(g1)}</span>`);
      html = html.replace(new RegExp(`${labels.result}:\\s*(失敗|逃走失敗)`, 'g'), (m, g1) =>
        `結果: <span style="color:#fc8181;font-weight:700;"><i class="fa-solid fa-skull"></i> ${_.escape(g1)}</span>`);
      html = html.replace(new RegExp(`${labels.battleResult}:\\s*([^|]+)`, 'g'), (m, val) =>
        `戦果: <span style="color:#e2e8f0;font-style:italic;">${val.trim()}</span>`);
      html = html.replace(new RegExp(`${labels.settlement}:\\s*([^|]+)`, 'g'), (m, val) =>
        `決済状態: <span style="color:#fbd38d;font-weight:600;">${val.trim()}</span>`);

      html = html.replace(new RegExp(`${labels.expDetail}:\\s*([^|]+)`, 'g'), (m, val) =>
        `経験明細: <span style="color:#e2e8f0;line-height:1.5;">${val.trim()}</span>`);
      html = html.replace(new RegExp(`${labels.expBasis}:\\s*([^|]+)`, 'g'), (m, val) =>
        `経験値の根拠: <span style="color:#fbd38d;">${val.trim()}</span>`);
      html = html.replace(new RegExp(`${labels.expTotal}:\\s*(\\[[^\\]]+\\]|\\d+)`, 'g'), (m, val) =>
        `EXP合計: <span style="color:#f6e05e;font-weight:700;"><i class="fa-solid fa-calculator"></i> ${val}</span>`);
      html = html.replace(new RegExp(`${labels.expActual}:\\s*(\\[[^\\]]+\\]|\\d+)`, 'g'), (m, val) =>
        `上限後の実際獲得EXP: <span style="color:#ffd700;font-weight:700;"><i class="fa-solid fa-arrow-trend-up"></i> ${val}</span>`);

      // ===== 意図 =====
      html = html.replace(new RegExp(`${labels.intent}:\\s*([^|]+)`, 'g'), (m, val) =>
        `意図: <span style="color:#fbd38d;">${val.trim()}</span>`);

      // ===== 効果/状態効果 =====
      wrapLabeledValue('状態効果:', new RegExp(`${labels.statusEffect}:\\s*([^|]+)`, 'g'), 'tag tag-type', 'fa-solid fa-circle-nodes',  { background: '#44337a', color: '#e9d8fd' }, 'tag-detail');
      html = html.replace(new RegExp(`(^|\\|\\s*)${labels.effect}:\\s*([^|]+)`, 'g'), (m, prefix, value) =>
        `${prefix}効果: <span class="tag tag-type tag-detail" style="background:#2d3748;color:#e2e8f0;"><i class="fa-solid fa-star-of-david"></i> ${value.trim()}</span>`);

      // ===== 生産・製作専用 =====
      wrapLabeledValue('投入物:', new RegExp(`${labels.materials}:\\s*([^|]+)`, 'g'),  'tag tag-sp', 'fa-solid fa-boxes-stacked', { background: '#276749', color: '#fff' }, 'tag-detail');
      wrapLabeledValue('投入:',   new RegExp(`${labels.input}:\\s*([^|]+)`, 'g'),      'tag tag-sp', 'fa-solid fa-box',           { background: '#276749', color: '#fff' }, 'tag-detail');
      wrapLabeledValue('損失:',   new RegExp(`${labels.loss}:\\s*([^|]+)`, 'g'),       'tag tag-hp', 'fa-solid fa-box-open',      { background: '#9b2c2c', color: '#fff' }, 'tag-detail');
      wrapLabeledValue('産出リスト:', new RegExp(`${labels.outputList}:\\s*([^|]+)`, 'g'), 'tag tag-sp', 'fa-solid fa-box-open',     { background: '#2f855a', color: '#fff' }, 'tag-detail');
      wrapLabeledValue('見積もり時間:', new RegExp(`${labels.eta}:\\s*([^|]+)`, 'g'),      'tag tag-round', 'fa-solid fa-clock',      { background: '#4a5568', color: '#fff' }, 'tag-detail');
      wrapLabeledValue('時間コスト:', new RegExp(`${labels.timeCost}:\\s*([^|]+)`, 'g'), 'tag tag-round', 'fa-solid fa-hourglass',  { background: '#4a5568', color: '#fff' }, 'tag-detail');
      wrapLabeledValue('一括検査:', new RegExp(`${labels.batchCheck}:\\s*([^|]+)`, 'g'), 'tag tag-type', 'fa-solid fa-layer-group', { background: '#2b6cb0', color: '#fff' });
      wrapLabeledValue('品質要求検査(半成品/完成品のみ):', new RegExp(`${labels.qualityCheck}:\\s*([^|]+)`, 'g'), 'tag tag-type', 'fa-solid fa-medal',          { background: '#2c5282', color: '#fff' }, 'tag-detail');
      wrapLabeledValue('規制投入物検査(半成品/完成品のみ):', new RegExp(`${labels.licenseCheck}:\\s*([^|]+)`, 'g'), 'tag tag-type', 'fa-solid fa-scale-balanced', { background: '#744210', color: '#fff' }, 'tag-detail');

      // ===== 生死状態 =====
      html = html.replace(/死亡\/毁坏|死亡\/毀壞|死亡\/破壊/g,
        '<span style="color:#e53e3e;font-weight:700;"><i class="fa-solid fa-skull"></i> 死亡/破壊</span>');
      html = html.replace(/未死\/存活|未死\/生存/g,
        '<span style="color:#68d391;font-weight:700;"><i class="fa-solid fa-heart-pulse"></i> 生存</span>');

      // ===== EXP / FP =====
      html = html.replace(/EXP\s*\+(\d+)/g, (m, val) =>
        `<span style="color:#ffd700;font-weight:700;"><i class="fa-solid fa-star"></i> EXP +${val}</span>`);
      html = html.replace(/FP\s*\+(\d+)/g, (m, val) =>
        `<span style="color:#90cdf4;font-weight:700;"><i class="fa-solid fa-gem"></i> FP +${val}</span>`);
      html = html.replace(new RegExp(`${labels.reward}:\\s*`, 'g'),
        '<span class="field-label">報酬:</span> ');

      // ===== 矢印テキスト統一：HTMLエンティティの表示を回避 =====
      html = html.replace(/-&gt;/g, '->');

      return html;
    }

    function renderPanel(panel, containerSelector, append = false) {
      const $container = $(containerSelector);
      if (!append) $container.empty();

      _.forEach(panel.sections, section => {
        const config = _.get(PanelConfig, section.title, {
          icon: 'fa-solid fa-circle-info',
          color: '#e8d5b7'
        });

        const $panel = $('<div class="action-panel">');

        const $header = $(`
          <div class="panel-header">
            <i class="panel-icon ${config.icon}" style="color:${config.color};"></i>
            <span class="panel-title">${_.escape(section.title)}</span>
            <i class="panel-toggle fa-solid fa-chevron-down"></i>
          </div>
        `);
        $header.on('click', function() {
          $(this).toggleClass('collapsed');
          $(this).siblings('.panel-content').toggleClass('collapsed');
        });
        $panel.append($header);

        const $content = $('<div class="panel-content">');
        _.forEach(section.rows, row => {
          $content.append(`<div class="data-row">${beautifyRow(row)}</div>`);
        });

        $panel.append($content);
        $container.append($panel);
      });
    }

    $(() => {
      const panel = parseActionInfo(mockBattleText);
      renderPanel(panel, '#content');
    });
  </script>
</body>
</html>
